<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>인천 에어맵 · 초미세먼지</title><meta name="description" content="인천 내륙과 송도의 초미세먼지 추정 분포와 측정소 관측값을 확인하세요.">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"><link rel="stylesheet" href="style.css">
<script defer src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script><script type="module" src="app.mjs"></script></head>
<body><main><div id="map" aria-label="인천 초미세먼지 지도"></div>
<header class="card" id="title"><div class="eyebrow">INCHEON AIR MAP <span id="mode"></span></div><h1>인천의 공기, 한눈에.</h1><p id="time">데이터를 불러오고 있습니다…</p><p id="source">인천 내륙 · 송도 / PM2.5</p></header>
<div id="status" class="card" role="status" aria-live="polite" hidden></div>
<nav class="tools" aria-label="지도 도구"><button id="reset" title="전체 보기" aria-label="전체 보기"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button><button id="view" title="2D/3D 전환" aria-label="2D/3D 전환" aria-pressed="false">2D</button><button id="location" title="내 위치" aria-label="내 위치"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="7.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22"/></svg></button><button id="retry" title="새로고침" aria-label="새로고침"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button></nav>
<section id="panel" class="card" aria-label="선택한 위치의 미세먼지" hidden><button id="close" aria-label="상세 닫기">×</button><div id="details" aria-live="polite"></div></section>
<div id="toast" class="card" role="status" hidden></div><div id="hint" class="card">궁금한 곳을 눌러 농도를 확인하세요</div>
<section id="legend" class="card" aria-label="PM2.5 등급 범례"><strong>PM2.5 <small>㎍/㎥</small></strong><div id="grades"></div><p>색은 분포를 나타냅니다</p></section>
</main></body></html>
